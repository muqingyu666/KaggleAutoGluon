# ==============================
# KaggleML 配置文件
# ==============================
# 修改此文件来适配你的数据集和任务

# --- 数据路径 ---
train_path: "data/train_data.csv"
test_path: "data/test_data.csv"
sample_submission_path: "sample_submission.csv"  # 无则设为 null
target: "income"       # 目标列名
id_col: "id"           # ID 列名，无则设为 null

# --- 问题类型与评估指标 ---
# problem_type: "classification" 或 "regression"
# 分类指标: roc_auc, accuracy, f1, log_loss
# 回归指标: rmse, mae, r2
problem_type: "classification"
eval_metric: "roc_auc"

# --- 要运行的模型 ---
# 支持: random_forest, xgboost, lightgbm, logistic_regression, linear_regression, autogluon
# 分类任务会自动跳过 linear_regression，回归任务会自动跳过 logistic_regression
models:
  - random_forest
  - xgboost
  - lightgbm
  - logistic_regression
  # - linear_regression      # 回归任务时启用
  # - autogluon              # 可选，需要: pip install autogluon

# --- 交叉验证 ---
cv:
  n_splits: 5
  seed: 42

# --- 输出 ---
output_dir: "results"

# --- AutoGluon 配置（可选，仅当 models 中包含 autogluon 时生效）---
# autogluon:
#   time_limit: 600          # 训练时间限制（秒）
#   presets: "medium_quality" # best_quality / high_quality / medium_quality
